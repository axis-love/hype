name: news-bot

services:
  newsbot:
    build:
      context: ../..
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    volumes:
      - ./state/data:/app/data
    environment:
      PYTHONUNBUFFERED: "1"
      NEWS_DB: /app/data/newsbot.sqlite
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BOT_TOKEN: ${BOT_TOKEN:-}
      NEWS_CHANNEL_ID: ${NEWS_CHANNEL_ID:-}
      LM_BASE: ${LM_BASE:-}
      LM_MODEL: ${LM_MODEL:-}
      LM_API_KEY: ${LM_API_KEY:-}
      LM_TIMEOUT: ${LM_TIMEOUT:-300}
      PH_API_KEY: ${PH_API_KEY:-}