[project]
name = "newsbot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "feedparser==6.0.12",
    "rapidfuzz==3.14.5",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==0.26.0",
]

[tool.setuptools.packages.find]
include = ["newsbot*", "core*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"