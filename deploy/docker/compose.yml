name: news-bot

services:
  newsbot:
    build:
      context: ../..
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    # Consumer API is published on loopback only — same-host consumers
    # (GirlLM) reach it at 127.0.0.1:$HYPE_API_PORT; nothing is exposed
    # publicly. Inside the container the server binds 0.0.0.0.
    ports:
      - "127.0.0.1:${HYPE_API_PORT:-8079}:${HYPE_API_PORT:-8079}"
    volumes:
      - ./state/data:/app/data
    environment:
      PYTHONUNBUFFERED: "1"
      NEWS_DB: /app/data/newsbot.sqlite
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BOT_TOKEN: ${BOT_TOKEN:-}
      NEWS_CHANNEL_ID: ${NEWS_CHANNEL_ID:-}
      LM_BASE: ${LM_BASE:-}
      LM_MODEL: ${LM_MODEL:-}
      LM_FILTER_MODEL: ${LM_FILTER_MODEL:-}
      LM_API_KEY: ${LM_API_KEY:-}
      LM_TIMEOUT: ${LM_TIMEOUT:-300}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      REDDIT_REFRESH_TOKEN: ${REDDIT_REFRESH_TOKEN:-}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      NEWS_TZ: ${NEWS_TZ:-Asia/Bangkok}
      NEWS_GEN_HOURS: ${NEWS_GEN_HOURS:-5,9,13,17,21}
      NEWS_STORE_CAP: ${NEWS_STORE_CAP:-36}
      NEWS_TEMP_FLOOR: ${NEWS_TEMP_FLOOR:-35}
      NEWS_THRESHOLD_RATIO: ${NEWS_THRESHOLD_RATIO:-0.5}
      NEWS_MERGE_BONUS: ${NEWS_MERGE_BONUS:-0.2}
      NEWS_MERGE_CAP: ${NEWS_MERGE_CAP:-2.0}
      ADMIN_USER_ID: ${ADMIN_USER_ID:-}
      # ── Consumer API (H4) ──
      # Unset HYPE_API_PORT disables the API entirely.
      HYPE_API_PORT: ${HYPE_API_PORT:-}
      HYPE_API_KEYS: ${HYPE_API_KEYS:-}
      HYPE_CONSUMER_GIRLLM_FLOOR: ${HYPE_CONSUMER_GIRLLM_FLOOR:-25}
      HYPE_CONSUMER_GIRLLM_RATIO: ${HYPE_CONSUMER_GIRLLM_RATIO:-0.3}
      HYPE_CONSUMER_GIRLLM_COOLDOWN_MAX: ${HYPE_CONSUMER_GIRLLM_COOLDOWN_MAX:-2}
      HYPE_CONSUMER_GIRLLM_MAX_CANDIDATES: ${HYPE_CONSUMER_GIRLLM_MAX_CANDIDATES:-5}