name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]" --constraint constraints.txt

      - name: Run tests
        run: pytest tests/ -q

      - name: Verify lock file is not stale
        run: |
          pip freeze --constraint constraints.txt > /tmp/installed.txt
          # Check that all direct deps in pyproject.toml are in constraints.txt
          python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              deps = tomllib.load(f).get('project', {}).get('dependencies', [])
          with open('constraints.txt') as f:
              lock = f.read()
          missing = [d.split('>=')[0].split('==')[0].split('~=')[0].strip().lower()
                     for d in deps if d.split('>=')[0].split('==')[0].split('~=')[0].strip().lower() not in lock.lower()]
          if missing:
              print(f'STALE LOCK: dependencies missing from constraints.txt: {missing}')
              exit(1)
          print('Lock file OK')
          "

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Build Docker image
        run: docker build -t newsbot-ci .

      - name: Verify imports
        run: |
          docker run --rm --entrypoint python newsbot-ci -c "
          import newsbot.main
          import newsbot.config
          import newsbot.db
          import newsbot.scoring
          import newsbot.dedupe
          import newsbot.summarizer
          import newsbot.telegram_poster
          import newsbot.bot_commands
          import newsbot.jobs
          import lm_client
          import core.log_sanitizer
          print('All imports OK')
          "